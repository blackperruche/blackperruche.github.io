<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reggae Surprise</title>
  <link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="audio-wrapper">
    <img src="logo-reggae-surprise.png" alt="Logo" id="logo" />
    <div id="play-button">▶</div>
  </div>

  <nav>
    <ul>
      <li><a href="#accueil">Accueil</a></li>
      <li><a href="#origines">Origines</a></li>
      <li><a href="#reseaux">Réseaux</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section id="accueil" class="section active">
      <h1>Bienvenue chez Reggae Surprise</h1>
    </section>

    <section id="origines" class="section">
      <h2>Origines</h2>
      <p>Ils voulaient juste faire une répète... Résultat : un groupe, du groove, et une grosse surprise.</p>
    </section>

    <section id="reseaux" class="section">
      <h2>Réseaux</h2>
      <p>Viens nous écouter sur ton réseau préféré 🎶</p>
      <div class="reseaux">
        <a href="https://www.instagram.com/reggaesurpriseoff/" target="_blank">
          <img src="instagram.png" alt="Instagram">
        </a>
        <a href="https://www.youtube.com/@ReggaeSurprise" target="_blank">
          <img src="youtube.png" alt="YouTube">
        </a>
        <a href="#" target="_blank">
          <img src="facebook.png" alt="Facebook">
        </a>
      </div>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <form action="https://formspree.io/f/xzbnjeyj" method="POST">
        <label for="nom">Nom :</label>
        <input type="text" name="nom" id="nom" required>

        <label for="email">Email :</label>
        <input type="email" name="email" id="email" required>

        <label for="message">Message :</label>
        <textarea name="message" id="message" required></textarea>

        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <audio id="audio-player" src="audio1.mp3"></audio>
  <script>
    const playButton = document.getElementById('play-button');
    const audio = document.getElementById('audio-player');
    let clickCount = 0;
    let timer;

    playButton.addEventListener('click', () => {
      clickCount++;
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (clickCount === 1) {
          audio.paused ? audio.play() : audio.pause();
        } else if (clickCount === 2) {
          audio.currentTime = 0;
          audio.play();
        }
        clickCount = 0;
      }, 300);
    });
  </script>
</body>
</html>
