<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reggae Surprise</title>
  <link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="logo-reggae-surprise.png" alt="Logo Reggae Surprise" class="logo" />
    <nav>
      <ul>
        <li><a href="#accueil">Accueil</a></li>
        <li><a href="#origines">Origines</a></li>
        <li><a href="#reseaux">Réseaux</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="accueil" class="section active">
      <h1>Bienvenue chez Reggae Surprise</h1>
    </section>

    <section id="origines" class="section">
      <h2>Origines</h2>
      <p>Ils voulaient juste faire une répète... Résultat : un groupe, du groove, et une grosse surprise.</p>
    </section>

    <section id="reseaux" class="section">
      <h2>Réseaux</h2>
      <p>Viens nous écouter sur ton réseau préféré 🎶</p>
      <div class="reseaux">
        <a href="https://www.instagram.com/reggaesurpriseoff/" target="_blank">
          <img src="instagram.png" alt="Instagram">
        </a>
        <a href="https://www.youtube.com/@ReggaeSurprise" target="_blank">
          <img src="youtube.png" alt="YouTube">
        </a>
        <a href="#" target="_blank">
          <img src="facebook.png" alt="Facebook">
        </a>
      </div>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <form action="https://formspree.io/f/xzbnjeyj" method="POST">
        <label for="nom">Nom :</label>
        <input type="text" name="nom" id="nom" required>

        <label for="email">Email :</label>
        <input type="email" name="email" id="email" required>

        <label for="message">Message :</label>
        <textarea name="message" id="message" required></textarea>

        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>
</body>
</html>
