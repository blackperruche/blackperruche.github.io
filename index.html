<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Black Perruche</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="background-overlay">
    <nav>
      <ul>
        <li><a href="#" onclick="showSection('accueil')">Accueil</a></li>
        <li><a href="#" onclick="showSection('origines')">Origines</a></li>
        <li><a href="#" onclick="showSection('reseaux')">Réseaux</a></li>
        <li><a href="#" onclick="showSection('concerts')">Concerts</a></li>
        <li><a href="#" onclick="showSection('playlists')">Playlists</a></li>
        <li><a href="#" onclick="showSection('contact')">Contact</a></li>
      </ul>
    </nav>

    <div class="content-wrapper" style="margin-top: 80px;">
      <div class="logo-container">
        <img src="logo.png" alt="Logo Black Perruche" class="logo glow" id="logo"
             ondblclick="togglePlayPause(event)" onclick="handleClick(event)">
        <div id="overlay-play-button" onclick="startPlayback()">▶</div>
      </div>

      <div id="accueil" class="section">
        <h1 class="highlight"><em>“Un style virevoltant qui vous met les plumes”</em></h1>
      </div>

      <div id="origines" class="section">
        <h1 class="highlight small origine-phrase">
          <em>
            “Maître Perruche sur un arbre avec 2 mecs perchés,<br>
            chantait dans son bec un air à la tangente<br>
            de la musique noire américaine et de la pop culture.”
          </em>
        </h1>

        <div class="origines-row">
          <div class="origine-profil">
            <img src="jack.jpg" alt="Photo de Jack">
            <p class="bio-text" id="bio-jack"></p>
          </div>

          <div class="origine-profil">
            <img src="james.jpg" alt="Photo de James">
            <p class="bio-text" id="bio-james"></p>
          </div>
        </div>
      </div>

      <!-- Les autres sections à insérer ici si besoin -->
    </div>

    <audio id="audio-player" src="" preload="auto"></audio>

    <script>
      const playlist = [...Array(10)].map((_, i) => ({ file: `audio${i + 1}.mp3` }));
      let currentTrack = 0;
      const audio = document.getElementById('audio-player');
      const playButton = document.getElementById('overlay-play-button');

      function playCurrentTrack() {
        audio.src = playlist[currentTrack].file;
        audio.play().then(() => playButton.style.display = "none").catch(() => playButton.style.display = "block");
        audio.onended = () => {
          currentTrack = (currentTrack + 1) % playlist.length;
          playCurrentTrack();
        };
      }

      function startPlayback() {
        playCurrentTrack();
      }

      function handleClick(event) {
        event.stopPropagation();
        currentTrack = (currentTrack + 1) % playlist.length;
        playCurrentTrack();
      }

      function togglePlayPause(event) {
        event.stopPropagation();
        audio.paused ? audio.play() : audio.pause();
      }

      function showSection(id) {
        document.querySelectorAll('.section').forEach(section => section.style.display = 'none');
        document.getElementById(id).style.display = 'block';
      }

      window.onload = () => {
        showSection('accueil');
      };

      const bios = {
        jack: {
          element: document.getElementById("bio-jack"),
          text: `Issu d’une famille mélomane, Mathieu alias Jack, se révèle une passion pour le chant à ses 15 ans. Il intègre plusieurs groupes amateurs (pop anglaise, rock français) mais surtout des duos (jazz et pop-rock). Après une longue pause à se chercher il revient à l’évidence : il faut se consacrer à la musique. Une formation de technicien du son studio dans la poche, il enchaîne les projets solos : un 1er EP électro-pop sous le pseudo « Carmen » puis un 2 ème en préparation, cette fois-ci sous « Matheus » et des chansons à textes. Rêveur, appliqué avec une touche de folie, Jack retrouve avec Black Perruche la tangente entre les musiques noires américaines, la pop culture et l’énergie des duos en osmose.`,
          click: 0
        },
        james: {
          element: document.getElementById("bio-james"),
          text: `C’est à 16 ans que Jérémy alias James, débourse sa première paye pour s’acheter une guitare électrique avec ampli. Autodidacte, il commence par des reprises de rock alternatif et de punk rock comme Nirvana et Sex Pistols. Il élargit son univers au fur et à mesure des rencontres, pour finalement ne pas se donner de limite. Il apprend mais enseigne aussi à de nombreux élèves. S’il multiplie les formations amateurs, il collabore notamment avec Amazigh Kateb. Vous l’aurez compris, la guitare a toujours fait partie intégrante de sa vie. Apaisant, mélodieux et passionné il saura faire vibrer les coeurs comme il fait vibrer les cordes de ses doigts.`,
          click: 0
        }
      };

      function typeText(name, index = 0) {
        const bio = bios[name];
        const words = bio.text.split(" ");
        if (index < words.length) {
          bio.element.innerHTML = words.slice(0, index + 1).join(" ") + " ";
          setTimeout(() => typeText(name, index + 1), 35);
        }
      }

      function toggleBio(name) {
        const bio = bios[name];
        bio.click++;
        if (bio.click % 3 === 1) {
          bio.element.innerText = "";
          typeText(name);
        } else if (bio.click % 3 === 2) {
          bio.element.innerText = "";
        } else {
          bio.element.innerText = bio.text;
        }
      }
    </script>
</body>
</html>
